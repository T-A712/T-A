<!-- ================= MUSIC SCRIPT ================= -->

  <script>

    const music =
      document.getElementById("backgroundMusic");

    const musicButton =
      document.getElementById("musicButton");


    function toggleMusic() {

      if (music.paused) {

        music.play();

        musicButton.textContent = "🔊";

      } else {

        music.pause();

        musicButton.textContent = "🎵";

      }

    }

  </script>


</body>
</html>
